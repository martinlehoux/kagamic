[tasks.generate]
run = "uv run python generate_tests.py"

[tasks.debug]
depends = ["generate"]
run = [
    "mkdir -p Debug",
    "cmake -DCMAKE_BUILD_TYPE=Debug -B Debug",
    "cmake --build Debug"
]

[tasks.release]
depends = ["generate"]
run = [
    "mkdir -p Release",
    "cmake -DCMAKE_BUILD_TYPE=Release -B Release",
    "cmake --build Release"
]

[tasks.profile]
depends = ["generate"]
run = [
    "mkdir -p Profile",
    "cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -B Profile",
    "cmake --build Profile",
    "valgrind --tool=callgrind --dump-instr=yes --callgrind-out-file=callgrind.out ./Profile/main 100MB.json 1",
    "kcachegrind callgrind.out"
]

[tasks.generate-bench]
run = [
    "uv run python generate_json.py 1",
    "uv run python generate_benchmarks.py"
]

[tasks.bench]
depends = ["generate-bench"]
run = [
    "mkdir -p Release",
    "cmake -DCMAKE_BUILD_TYPE=Release -B Release",
    "cmake --build Release",
    "./Release/bench"
]

[tasks.test]
depends = ["debug"]
run = "./Debug/test"

[tasks.format]
run = "clang-format -i src/**/*.c src/**/*.h *.c"

[tasks.check]
depends = ["debug"]
run = [
    "clang-format --dry-run src/**/*.c src/**/*.h *.c --fail-on-incomplete-format",
    "ruff check",
    "ruff format --check",
    "uv run ty check",
    "mise run test"
]
